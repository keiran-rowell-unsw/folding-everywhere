[package]
name = "esmfold1"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust fp32 reimplementation of ESMFold v1"

[lib]
name = "esmfold"
path = "src/lib.rs"

[[bin]]
name = "fold"
path = "src/bin/fold.rs"

[dependencies]
memmap2 = "0.9"
safetensors = "0.4"
half = { version = "2", features = ["bytemuck"] }
bytemuck = "1"
rayon = "1.10"
libm = "0.2"
serde_json = "1"

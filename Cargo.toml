[workspace]
members = [
    "gui",
    "esmfold/esmfold1",
    "esmfold/esmfold2",
    "proteinmpnn/mpnn",
    "rfdiffusion2/rfd2",
]
resolver = "2"

# Identical to the three source repos, so the merged build's numerics are
# unchanged: opt-level 3, no LTO, 16 codegen units.
[profile.release]
opt-level = 3
lto = false
codegen-units = 16

[package]
name = "folding-everywhere-gui"
version = "2.0.0"
edition = "2021"
description = "One local-web GUI for ESMFold 1/2, ProteinMPNN and RFdiffusion2 — pure Rust, no Python, no GPU"

[[bin]]
name = "gui"
path = "src/main.rs"

[dependencies]
esmfold     = { path = "../esmfold/esmfold1", package = "esmfold1" }
esmfold2    = { path = "../esmfold/esmfold2", package = "esmfold2-fp32" }
proteinmpnn = { path = "../proteinmpnn/mpnn" }
rfd2        = { path = "../rfdiffusion2/rfd2" }
tiny_http   = "0.12"
serde_json  = "1"

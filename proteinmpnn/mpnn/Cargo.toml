[package]
name = "proteinmpnn"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust fp32 reimplementation of ProteinMPNN"

[lib]
name = "proteinmpnn"
path = "src/lib.rs"

[[bin]]
name = "mpnn"
path = "src/bin/mpnn.rs"

[dependencies]
memmap2 = "0.9"
rayon = "1.10"
libm = "0.2"
serde_json = "1"
